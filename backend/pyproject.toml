[project]
name = "messdaten-karte-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "contourpy>=1.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pykrige>=1.7.3",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
    "werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert und Test-Passwörter sind in Tests gewollt

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
