name: CI

# Alle Tests bei jedem Push auf einen Branch und bei jedem Pull Request.
# Tag-Pushes (Releases) startet release.yml, das dieselben Prüfungen über workflow_call nutzt.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      # Eigene Test-Datenbank, nie Produktivdaten (siehe CLAUDE.md)
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: messdaten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messdaten_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/messdaten_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    name: Frontend (Typecheck, Tests, Build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker-Images bauen (ohne Veröffentlichung)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compose-Datei prüfen
        env:
          POSTGRES_PASSWORD: ci-platzhalter
          SECRET_KEY: ci-platzhalter-ci-platzhalter-ci-platzhalter
        run: docker compose --profile frontend config --quiet
      - name: Backend-Image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend-Image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
