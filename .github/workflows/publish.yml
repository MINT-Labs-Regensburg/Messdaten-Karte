name: Publish

# Veröffentlicht die Docker-Images nach GHCR, jeweils erst nach grünen Tests:
#   - Push auf main (also jeder gemergte PR): Tags `latest` und `sha-<kurzer Commit>`.
#     `latest` zeigt damit immer auf den neuesten Stand von main.
#   - Versions-Tag (z. B. v1.2.0, Vorabversion v1.2.0-rc.1): Tags 1.2.0, 1.2 und 1
#     (Vorabversionen nur mit ihrem eigenen Tag) und zusätzlich ein GitHub Release.
#       git tag v1.2.0 && git push origin v1.2.0
#     oder „Draft a new release“ auf GitHub (das legt den Tag an).
# Ein Versions-Tag verschiebt `latest` nie: Das tut ausschließlich main.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

# Bei zwei schnell aufeinanderfolgenden Merges gewinnt der neuere Lauf, damit ein älterer
# Lauf `latest` nicht nachträglich überschreibt. Tag-Läufe werden nie abgebrochen.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name (kleingeschrieben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/messdaten-karte-${{ matrix.component }}" >> "$GITHUB_ENV"
      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` nur ausdrücklich und nur von main, nie automatisch von einem Tag
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

  release:
    name: GitHub Release
    # Nur bei Versions-Tags; ein Push auf main veröffentlicht nur die Images
    if: github.ref_type == 'tag'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Release anlegen
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits (z. B. über die Oberfläche angelegt); nichts zu tun."
            exit 0
          fi
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          cat > notes.md <<EOF
          ## Docker-Images

          \`\`\`bash
          docker pull ghcr.io/${owner}/messdaten-karte-backend:${version}
          docker pull ghcr.io/${owner}/messdaten-karte-frontend:${version}
          \`\`\`

          Plattformen: linux/amd64, linux/arm64.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --notes-file notes.md "${flags[@]}"
